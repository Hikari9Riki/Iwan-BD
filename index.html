<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#171b35">
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <main class="birthday-page">
    <aside class="left-column" aria-labelledby="birthday-title">
      <div class="title-block"><p class="eyebrow">Card untuk anda<span>✦</span></p><h1 id="birthday-title">Selamat<br><em>Hari Jadi</em></h1><p class="name">Iwan</p></div>
      <div class="wish-block"><p class="eyebrow">Selamat Menetas Ridzwan</p><p class="wish">Nothin else I could wish more than your happiness</p><p class="from">From Seringku_lupa <span>♡</span></p><button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false"><span aria-hidden="true">♫</span> Tap for chime</button></div>
    </aside>
    <section class="memory-stage" aria-label="Seven birthday memories">
      <div class="gallery-window">
        <div class="memory-gallery" id="memory-gallery" tabindex="0" aria-label="Seven birthday memories. Scroll up or down to explore them.">
         
      
          <figure class="memory memory-image1"><img src="assets/images/image1.jpg" alt="A colourful birthday gift"><figcaption>Menjelingnya dia</figcaption></figure>
          <figure class="memory memory-image2"><img src="assets/images/image3.jpg" alt="A birthday cake with lit candles"><figcaption>Semoga kau dikelilingi oleh rakan yang baik</figcaption></figure>
          <figure class="memory memory-image12 portrait-card"><video src="assets/video/Vid4.mp4" muted playsinline preload="metadata" style="pointer-events: none;"><track kind="captions" src="assets/subtitles/Vid1.vtt" srclang="en" label="English"></video><div class="play-icon">▶</div><figcaption>Hopefully kau tak lupa untuk Baca Alquran， sama-sama kita betulkan bacaan kita dan istiqamah. chaiyokkkkkk. sumpah ni penting</figcaption></figure>
          <figure class="memory memory-image12 portrait-card"><video src="assets/video/Vid8.mp4" muted playsinline preload="metadata" style="pointer-events: none;"><track kind="captions" src="assets/subtitles/Vid8.vtt" srclang="en" label="English"></video><div class="play-icon">▶</div><figcaption>Sorry to say, but this moment i feel so happy... dont know why. repeatly look at this moment... rasa macam nak nangis. tak tahu kenapa.</figcaption></figure>
          <figure class="memory memory-image12"><video src="assets/video/Vid3.mp4" muted playsinline preload="metadata" style="pointer-events: none;"><track kind="captions" src="assets/subtitles/Vid3.vtt" srclang="en" label="English"></video><div class="play-icon">▶</div><figcaption>xde gambar selfie sekali. ada video ni je</figcaption></figure>
          <figure class="memory memory-image7"><img src="assets/images/image7.jpg" alt="A collection of travel memories"><figcaption>Pliss, awak terlalu dekat... takut saya</figcaption></figure>
          <figure class="memory memory-image8"><img src="assets/images/image8.jpg" alt="A colourful birthday gift"><figcaption>Iwan with balet style</figcaption></figure>
          <figure class="memory memory-image9"><img src="assets/images/image9.jpg" alt="A birthday cake with lit candles"><figcaption>Ni muka mcm apa agaknya ehhh ni?</figcaption></figure>
          <figure class="memory memory-image11"><img src="assets/images/image11.jpg" alt="Festive birthday balloons"><figcaption>Chinese with Chinlay。。。 slay gitu。。。</figcaption></figure>
          <figure class="memory memory-image10"><img src="assets/images/image12.jpg" alt="Sunny travel photographs"><figcaption>Iwan garunkk style</figcaption></figure>
          <figure class="memory memory-image4"><img src="assets/images/image13.jpg" alt="Festive birthday balloons"><figcaption>As for me this one is the most beatiful picture I ever take sebab...</figcaption></figure>
          <figure class="memory memory-letter" data-type="letter"><img src="assets/images/envelope.jpg" alt="A special letter"><div class="letter-content" hidden><h2>Kehadapan Iwan,</h2><p>Happy Birthday! Terima kasih sebab dh teman aku untuk for 1 year and half dekat UIA. Thanks sebab be a reason untuk aku senyum.</p><p>Bagi aku, kau adalah insan sangat menarik. for the first time jumpa dan kau meludahkan sejarah. Aku fikir, menarik budak ni.</p><p>apa-apa, may you always happy dan semoga kau dalam jagaan Allah selalu.</p><p>From<br>Seringku_lupa</p></div><figcaption>Surat Hogwart</figcaption></figure>
          <!-- The corrected Video Thumbnail with autoplay and pointer-events disabled -->
          <figure class="memory memory-image12"><video src="assets/video/Vid1.mp4" muted playsinline preload="metadata" style="pointer-events: none;"><track kind="captions" src="assets/subtitles/Vid1.vtt" srclang="en" label="English"></video><div class="play-icon">▶</div><figcaption>a recap, maybe</figcaption></figure>
          <figure class="memory memory-image12 portrait-card"><video src="assets/video/Vid9.mp4" muted playsinline preload="metadata" style="pointer-events: none;"><track kind="captions" src="assets/subtitles/Vid9.vtt" srclang="en" label="English"></video><div class="play-icon">▶</div><figcaption>just for fun</figcaption></figure>
          <figure class="memory hidden-card" id="surprise-video"><video src="assets/video/Vid11.mp4" muted playsinline preload="metadata" style="pointer-events: none;"></video><div class="play-icon">▶</div><figcaption></figcaption></figure>

        </div>
        <div class="center-glow" aria-hidden="true"></div>
        <div class="scroll-cue" aria-hidden="true"><span>Swipe · scroll</span><b>↕</b></div>
      </div>
    </section>
  </main>
  <section class="image-viewer" id="image-viewer" role="dialog" aria-modal="true" aria-label="Expanded birthday photo" hidden>
    <button class="viewer-close" id="viewer-close" type="button">← Back to scrolling</button>
    <figure class="viewer-content"><video id="viewer-video" controls hidden></video><img id="viewer-image" src="" alt=""><div id="viewer-letter" class="viewer-letter" hidden></div><figcaption id="viewer-caption"></figcaption></figure>
  </section>
  <script src="js/script.js"></script>
  <div id="toast-notification" class="toast">A new memory has appeared! ✦</div>
</body>
</html>
